# ============================================
# GialloZafferano - Docker Compose
# Configurazione per Hostinger VPS
# ============================================

services:
  affitti-milano:
    build:
      context: .
      dockerfile: Dockerfile
    image: affitti-milano:latest
    container_name: affitti_milano_app
    restart: unless-stopped
    ports:
      # Exposes port 3000 directly on VPS IP and allows Nginx reverse proxy
      - "${PORT:-3000}:3070"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
    # Healthcheck to ensure container is responding
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Log rotation limits to prevent Hostinger VPS disk space exhaustion
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M
